name: Native desktop regression
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      full-matrix:
        type: boolean
        default: false
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || inputs.full-matrix) && '["ubuntu-24.04","windows-latest"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    env:
      GDK_BACKEND: x11
      WEBKIT_DISABLE_DMABUF_RENDERER: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.33.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.21.1
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb xdotool
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          workspaces: src-tauri -> target/desktop-e2e
          key: desktop-e2e-${{ runner.os }}
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Install Linux desktop driver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Linux desktop-driver preflight
        if: runner.os == 'Linux'
        run: |
          tauri-driver --help
      - run: pnpm build:desktop:e2e
      - name: Linux journeys
        if: runner.os == 'Linux'
        shell: bash
        run: |
          repeats=1
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then repeats=3; fi
          any_failed=0
          for run in $(seq 1 "$repeats"); do
            rm -f test-results/desktop/results.json
            if ! xvfb-run --auto-servernum pnpm test:desktop; then any_failed=1; fi
            if ! cp test-results/desktop/results.json "test-results/desktop/run-$run.json"; then any_failed=1; fi
          done
          exit "$any_failed"
      - name: Windows journeys
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $anyFailed = $false
          1..3 | ForEach-Object {
            $run = $_
            $runFailed = $false
            Remove-Item test-results/desktop/results.json -Force -ErrorAction SilentlyContinue
            try {
              pnpm test:desktop
              if ($LASTEXITCODE -ne 0) { $runFailed = $true }
            } catch {
              $runFailed = $true
            }
            if (Test-Path test-results/desktop/results.json) {
              try {
                Copy-Item test-results/desktop/results.json "test-results/desktop/run-$run.json" -ErrorAction Stop
              } catch {
                $runFailed = $true
              }
            } else {
              $runFailed = $true
            }
            if ($runFailed) { $anyFailed = $true }
          }
          if ($anyFailed) { exit 1 }
      - name: Retain sanitized outcomes only
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: desktop-outcomes-${{ runner.os }}
          path: test-results/desktop/*.json
          retention-days: 7
