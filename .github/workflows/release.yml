name: Draft release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to build and attach to a draft prerelease
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Confirm exact tagged commit and version
        run: |
          git tag --points-at HEAD | grep --fixed-strings --line-regexp "$RELEASE_TAG"
          node scripts/release-assets.mjs verify-version --tag "$RELEASE_TAG"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.21.1
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.8.1
        with:
          workspaces: src-tauri -> target
          key: release-validate-ubuntu-24.04-x86_64-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Install Rust coverage tool
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Frontend checks
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:coverage
          pnpm build
      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
      - name: Rust coverage
        run: pnpm test:rust:coverage
      - name: Coverage floors
        run: pnpm check:coverage
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-validation-coverage-reports
          path: |
            coverage/renderer/coverage-summary.json
            coverage/renderer/lcov.info
            coverage/rust/lcov.info
            coverage/rust/coverage.json
          if-no-files-found: error
          retention-days: 7

  visual:
    uses: ./.github/workflows/visual.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      require-approval: true

  desktop:
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      full-matrix: true

  build:
    name: Build ${{ matrix.id }}
    needs: [validate, visual, desktop]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: raw-windows-x64
          - id: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundle: deb,rpm,appimage
            artifact: raw-linux-x64
          - id: macos-intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundle: app,dmg
            artifact: raw-macos-x64
          - id: macos-apple-silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            bundle: app,dmg
            artifact: raw-macos-arm64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      LEGAL_MASR_UPDATER_PUBLIC_KEY: ${{ vars.LEGAL_MASR_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Confirm native macOS runner architecture
        if: startsWith(matrix.id, 'macos-')
        shell: bash
        run: |
          actual_architecture="$(uname -m)"
          expected_architecture="${{ matrix.target == 'aarch64-apple-darwin' && 'arm64' || 'x86_64' }}"
          echo "Runner architecture: $actual_architecture; expected: $expected_architecture"
          test "$actual_architecture" = "$expected_architecture"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.21.1
      - name: Install Linux Tauri packaging dependencies
        if: matrix.id == 'linux-x64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libfuse2 patchelf rpm xvfb
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.8.1
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.id == 'linux-x64' && 'ubuntu-24.04' || runner.os }}-${{ matrix.target }}-${{ matrix.id }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Prepare signed updater configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/prepare-updater.mjs
      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --config release-updater.conf.json
      - name: Verify production harness boundary
        shell: bash
        run: node scripts/verify-release-boundary.mjs "src-tauri/target/${{ matrix.target }}/release/legalmaster-solo${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: Normalize and verify Linux AppImage runtime
        if: matrix.id == 'linux-x64'
        shell: bash
        run: |
          appimages=(src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage)
          test "${#appimages[@]}" -eq 1
          node scripts/normalize-appimage-runtime.mjs "${appimages[0]}"
          node scripts/verify-appimage-runtime.mjs "${appimages[0]}"
          set +e
          env -u GDK_BACKEND APPIMAGE_EXTRACT_AND_RUN=1 timeout --signal=TERM 15s xvfb-run --auto-servernum "${appimages[0]}" > appimage-smoke.log 2>&1
          status=$?
          set -e
          cat appimage-smoke.log
          test "$status" -eq 124
          ! grep --fixed-strings "Could not create default EGL display" appimage-smoke.log
      - name: Sign the final normalized AppImage
        if: matrix.id == 'linux-x64' && vars.LEGAL_MASR_UPDATER_PUBLIC_KEY != ''
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          appimages=(src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage)
          test "${#appimages[@]}" -eq 1
          pnpm tauri signer sign "${appimages[0]}"
      - name: Verify Windows NSIS installer
        if: matrix.id == 'windows-x64'
        shell: pwsh
        run: |
          $files = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe"
          if ($files.Count -ne 1) { throw "Expected exactly one NSIS installer; found $($files.Count)." }
      - name: Create Windows portable archive
        if: matrix.id == 'windows-x64'
        shell: pwsh
        run: |
          $executables = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/*.exe" -File
          if ($executables.Count -ne 1) { throw "Expected exactly one portable application executable; found $($executables.Count)." }
          New-Item -ItemType Directory -Force -Path "release-portable" | Out-Null
          Compress-Archive -LiteralPath $executables[0].FullName -DestinationPath "release-portable/Legal-Masr-windows-x64-portable.zip" -CompressionLevel Optimal
          if (-not (Test-Path "release-portable/Legal-Masr-windows-x64-portable.zip" -PathType Leaf)) { throw "Windows portable archive was not created." }
      - name: Verify Linux packages
        if: matrix.id == 'linux-x64'
        shell: bash
        run: |
          shopt -s nullglob
          debs=(src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb)
          rpms=(src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm)
          appimages=(src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage)
          test "${#debs[@]}" -eq 1
          test "${#rpms[@]}" -eq 1
          test "${#appimages[@]}" -eq 1
      - name: Verify macOS app signature and DMG
        if: startsWith(matrix.id, 'macos-')
        shell: bash
        run: |
          shopt -s nullglob
          apps=(src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app)
          dmgs=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          test "${#apps[@]}" -eq 1
          test "${#dmgs[@]}" -eq 1
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          codesign -dv --verbose=4 "${apps[0]}" 2>&1 | tee codesign-details.txt
          grep -F "Signature=adhoc" codesign-details.txt
          if ! spctl --assess --type execute --verbose=4 "${apps[0]}"; then
            echo "Gatekeeper rejection is expected for this ad-hoc signed, unnotarized application."
          fi
          echo "The application is ad-hoc signed but not notarized."
          echo "Users may need to approve it in macOS Privacy & Security."
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.id == 'windows-x64' && 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe' || '' }}
            ${{ matrix.id == 'windows-x64' && 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig' || '' }}
            ${{ matrix.id == 'windows-x64' && 'release-portable/*.zip' || '' }}
            ${{ matrix.id == 'linux-x64' && 'src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb' || '' }}
            ${{ matrix.id == 'linux-x64' && 'src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm' || '' }}
            ${{ matrix.id == 'linux-x64' && 'src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage' || '' }}
            ${{ matrix.id == 'linux-x64' && 'src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig' || '' }}
            ${{ startsWith(matrix.id, 'macos-') && format('src-tauri/target/{0}/release/bundle/macos/*.app.tar.gz*', matrix.target) || '' }}
            ${{ startsWith(matrix.id, 'macos-') && format('src-tauri/target/{0}/release/bundle/dmg/*.dmg', matrix.target) || '' }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Create draft prerelease
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.21.1
      - name: Confirm exact tagged commit and version
        run: |
          git tag --points-at HEAD | grep --fixed-strings --line-regexp "$RELEASE_TAG"
          node scripts/release-assets.mjs verify-version --tag "$RELEASE_TAG"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: raw-*
          path: release-raw
          merge-multiple: false
      - name: Name artifacts and generate SHA-256 checksums
        env:
          UPDATER_ENABLED: ${{ vars.LEGAL_MASR_UPDATER_PUBLIC_KEY != '' }}
          LEGAL_MASR_UPDATER_PUBLIC_KEY: ${{ vars.LEGAL_MASR_UPDATER_PUBLIC_KEY }}
        run: |
          updater_args=()
          if [ "$UPDATER_ENABLED" = "true" ]; then updater_args+=(--updater); fi
          node scripts/release-assets.mjs stage --input release-raw --output release-assets "${updater_args[@]}"
      - name: Write release notes
        run: |
          cat > release-notes.md <<EOF
          ## Legal Masr ${RELEASE_TAG}

          Downloads included in this draft prerelease:

          - Windows x86-64: \`Legal-Masr_${RELEASE_TAG#v}_windows_x64-setup.exe\`
          - Windows x86-64 portable: \`Legal-Masr_${RELEASE_TAG#v}_windows_x64-portable.zip\`
          - Linux x86-64 Debian: \`Legal-Masr_${RELEASE_TAG#v}_linux_x64.deb\`
          - Linux x86-64 RPM: \`Legal-Masr_${RELEASE_TAG#v}_linux_x64.rpm\`
          - Linux x86-64 AppImage: \`Legal-Masr_${RELEASE_TAG#v}_linux_x64.AppImage\`
          - macOS Intel: \`Legal-Masr_${RELEASE_TAG#v}_macos_x64.dmg\`
          - macOS Apple Silicon: \`Legal-Masr_${RELEASE_TAG#v}_macos_arm64.dmg\`

          The Windows installer is currently unsigned. Windows may show a publisher or SmartScreen warning.
          The portable archive contains the unsigned Windows executable; it does not make the application's local data directory portable.

          Linux packages are currently unsigned. Install the Debian and RPM packages with your normal package manager, or mark the AppImage executable before launching it.

          The macOS builds are ad-hoc signed and are not notarized. Gatekeeper may require manual approval in **System Settings → Privacy & Security** before first launch.

          SHA-256 checksums are in \`SHA256SUMS.txt\`; checksums are integrity aids, not code signatures.

          Windows 10 and Windows 11 are the currently documented Windows targets. Back up your data before updating beta releases.
          EOF
      - name: Create or update draft prerelease
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --draft --prerelease --title "Legal Masr $RELEASE_TAG" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --draft --prerelease --title "Legal Masr $RELEASE_TAG" --notes-file release-notes.md
          fi
