name: Draft release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to build and attach to a draft prerelease
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.id }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: raw-windows-x64
          - id: macos-intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
            artifact: raw-macos-x64
          - id: macos-apple-silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: raw-macos-arm64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f398a1d6caa5f0c0fb413a5c30e1ffb6d0f0 # v5.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Confirm exact tagged commit and version
        shell: bash
        run: |
          git tag --points-at HEAD | grep --fixed-strings --line-regexp "$RELEASE_TAG"
          node scripts/release-assets.mjs verify-version --tag "$RELEASE_TAG"
      - name: Confirm native macOS runner architecture
        if: startsWith(matrix.id, 'macos-')
        shell: bash
        run: |
          actual_architecture="$(uname -m)"
          expected_architecture="${{ matrix.target == 'aarch64-apple-darwin' && 'arm64' || 'x86_64' }}"
          echo "Runner architecture: $actual_architecture; expected: $expected_architecture"
          test "$actual_architecture" = "$expected_architecture"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.21.1
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.8.1
        with:
          workspaces: src-tauri -> target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ matrix.id }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Frontend checks
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        with:
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Verify Windows NSIS installer
        if: matrix.id == 'windows-x64'
        shell: pwsh
        run: |
          $files = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe"
          if ($files.Count -ne 1) { throw "Expected exactly one NSIS installer; found $($files.Count)." }
      - name: Verify macOS app signature and DMG
        if: startsWith(matrix.id, 'macos-')
        shell: bash
        run: |
          shopt -s nullglob
          apps=(src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app)
          dmgs=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          test "${#apps[@]}" -eq 1
          test "${#dmgs[@]}" -eq 1
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          codesign -dv --verbose=4 "${apps[0]}" 2>&1 | tee codesign-details.txt
          grep -F "Signature=adhoc" codesign-details.txt
          if ! spctl --assess --type execute --verbose=4 "${apps[0]}"; then
            echo "Gatekeeper rejection is expected for this ad-hoc signed, unnotarized application."
          fi
          echo "The application is ad-hoc signed but not notarized."
          echo "Users may need to approve it in macOS Privacy & Security."
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*.${{ matrix.bundle == 'nsis' && 'exe' || 'dmg' }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Create draft prerelease
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f398a1d6caa5f0c0fb413a5c30e1ffb6d0f0 # v5.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.21.1
      - name: Confirm exact tagged commit and version
        run: |
          git tag --points-at HEAD | grep --fixed-strings --line-regexp "$RELEASE_TAG"
          node scripts/release-assets.mjs verify-version --tag "$RELEASE_TAG"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: raw-*
          path: release-raw
          merge-multiple: false
      - name: Name artifacts and generate SHA-256 checksums
        run: node scripts/release-assets.mjs stage --input release-raw --output release-assets
      - name: Write release notes
        run: |
          cat > release-notes.md <<EOF
          ## LegalMaster Solo ${RELEASE_TAG}

          Downloads included in this draft prerelease:

          - Windows x86-64: `LegalMaster-Solo_${RELEASE_TAG#v}_windows_x64-setup.exe`
          - macOS Intel: `LegalMaster-Solo_${RELEASE_TAG#v}_macos_x64.dmg`
          - macOS Apple Silicon: `LegalMaster-Solo_${RELEASE_TAG#v}_macos_arm64.dmg`

          The Windows installer is currently unsigned. Windows may show a publisher or SmartScreen warning.

          The macOS builds are ad-hoc signed and are not notarized. Gatekeeper may require manual approval in **System Settings → Privacy & Security** before first launch.

          SHA-256 checksums are in `SHA256SUMS.txt`; checksums are integrity aids, not code signatures.

          Windows 10 and Windows 11 are the currently documented Windows targets. Back up your data before updating beta releases.
          EOF
      - name: Create or update draft prerelease
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --draft --prerelease --title "LegalMaster Solo $RELEASE_TAG" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --draft --prerelease --title "LegalMaster Solo $RELEASE_TAG" --notes-file release-notes.md
          fi
