name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.21.1
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.8.1
        with:
          workspaces: src-tauri -> target
          key: ubuntu-24.04-x86_64-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Install Rust coverage tool
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Frontend checks
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:coverage
          pnpm build
      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
      - name: Rust coverage
        run: pnpm test:rust:coverage
      - name: Coverage floors
        run: pnpm check:coverage
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: validation-coverage-reports
          path: |
            coverage/renderer/coverage-summary.json
            coverage/renderer/lcov.info
            coverage/rust/lcov.info
            coverage/rust/coverage.json
          if-no-files-found: error
          retention-days: 7
      - name: Dependency vulnerability checks
        run: |
          pnpm audit --prod --audit-level=high
          cargo install cargo-audit --locked
          cd src-tauri && cargo audit

  visual:
    uses: ./.github/workflows/visual.yml

  desktop:
    uses: ./.github/workflows/desktop.yml

  linux-packages:
    name: Build Linux debug packages
    needs: [validate, visual, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.21.1
      - name: Install Linux Tauri packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libfuse2 patchelf rpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.8.1
        with:
          workspaces: src-tauri -> target
          key: ubuntu-24.04-x86_64-debug-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Build debug Linux bundles
        run: pnpm tauri build --debug --bundles deb,rpm,appimage
      - name: Verify production harness boundary
        run: node scripts/verify-release-boundary.mjs src-tauri/target/debug/legalmaster-solo
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: legalmaster-solo-linux-debug-deb
          path: src-tauri/target/debug/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: legalmaster-solo-linux-debug-rpm
          path: src-tauri/target/debug/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: legalmaster-solo-linux-debug-appimage
          path: src-tauri/target/debug/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

  windows-packages:
    name: Build Windows debug packages
    needs: [validate, visual, desktop]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.21.1
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.8.1
        with:
          workspaces: src-tauri -> target
          key: windows-x86_64-debug-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Build Windows debug NSIS package
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        with:
          tauriScript: pnpm tauri
          args: --target x86_64-pc-windows-msvc --debug --bundles nsis
      - name: Verify production harness boundary
        run: node scripts/verify-release-boundary.mjs src-tauri/target/x86_64-pc-windows-msvc/debug/legalmaster-solo.exe
      - name: Create and verify Windows debug artifacts
        shell: pwsh
        run: |
          $installers = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/debug/bundle/nsis/*.exe" -File
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer; found $($installers.Count)." }
          $executables = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/debug/*.exe" -File
          if ($executables.Count -ne 1) { throw "Expected exactly one portable application executable; found $($executables.Count)." }
          New-Item -ItemType Directory -Force -Path "windows-debug-portable" | Out-Null
          Compress-Archive -LiteralPath $executables[0].FullName -DestinationPath "windows-debug-portable/LegalMaster-Solo-windows-x64-portable.zip" -CompressionLevel Optimal
          if (-not (Test-Path "windows-debug-portable/LegalMaster-Solo-windows-x64-portable.zip" -PathType Leaf)) { throw "Windows portable archive was not created." }
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: legalmaster-solo-windows-debug-installer
          path: src-tauri/target/x86_64-pc-windows-msvc/debug/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: legalmaster-solo-windows-debug-portable
          path: windows-debug-portable/*.zip
          if-no-files-found: error
          retention-days: 7
