<body class="antialiased text-on-surface bg-canvas min-h-screen flex items-center justify-center relative">
<!-- Background overlay (representing the rest of the app) -->
<div class="fixed inset-0 bg-inverse-surface/40 z-40 backdrop-blur-sm"></div>
<!-- Dialog Container -->
<div class="bg-surface rounded-xl shadow-2xl w-full max-w-2xl z-50 flex flex-col max-h-[921px] border border-border-default overflow-hidden">
<!-- Header -->
<div class="px-gutter py-4 border-b border-border-default flex items-center justify-between bg-surface-bright sticky top-0 z-10"><div class="flex items-center gap-3"><h2 class="font-title text-title text-primary m-0">تعديل المهمة</h2><span class="bg-warning/10 text-warning px-2 py-0.5 rounded font-caption text-caption flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">edit_note</span>تغييرات غير محفوظة</span></div><div class="flex items-center gap-2"><button aria-label="المزيد" class="text-on-surface-variant hover:text-on-surface transition-colors p-2 rounded-full hover:bg-surface-variant"><span class="material-symbols-outlined">more_vert</span></button><button aria-label="إغلاق" class="text-on-surface-variant hover:text-on-surface transition-colors p-2 rounded-full hover:bg-surface-variant"><span class="material-symbols-outlined">close</span></button></div></div>
<!-- Scrollable Content Area -->
<div class="p-gutter overflow-y-auto custom-scrollbar flex-1 flex flex-col gap-margin"><div class="space-y-6"><div class="space-y-1"><label class="font-label text-label text-text-primary" for="taskName">اسم المهمة <span class="text-error">*</span></label><input class="w-full bg-white border border-border-default rounded px-3 py-2 text-text-primary font-body text-body outline-none focus:border-focus-ring focus:ring-1 focus:ring-focus-ring shadow-sm" id="taskName" required="" type="text" value="تقديم مستندات الدعوى"/></div><div class="flex items-center gap-3 p-3 border border-border-default rounded bg-surface-subtle"><input class="w-5 h-5 rounded border-border-strong text-primary focus:ring-focus-ring" id="task-completed" type="checkbox"/><label class="font-label text-label text-text-primary cursor-pointer select-none" for="task-completed">المهمة مكتملة</label></div><div class="space-y-1"><label class="font-label text-label text-text-secondary" for="taskDetails">تفاصيل المهمة (اختياري)</label><textarea class="w-full bg-white border border-border-default rounded px-3 py-2 text-text-primary font-body text-body focus:border-focus-ring focus:ring-1 focus:ring-focus-ring outline-none resize-none placeholder:text-text-disabled" id="taskDetails" placeholder="أدخل تفاصيل المهمة هنا..." rows="3"></textarea></div><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div class="space-y-1"><label class="font-label text-label text-text-primary" for="executionDate">تاريخ التنفيذ</label><div class="relative"><input class="w-full bg-white border border-border-default rounded px-3 py-2 pr-10 text-text-primary font-body text-body text-right focus:border-focus-ring focus:ring-1 focus:ring-focus-ring outline-none" dir="ltr" id="executionDate" type="text" value="15/11/2023"/><span class="material-symbols-outlined absolute right-3 top-2.5 text-text-secondary pointer-events-none">calendar_today</span></div></div><div class="space-y-1"><label class="font-label text-label text-text-primary flex items-center justify-between"><span>تذكير</span><button aria-checked="true" class="relative inline-flex h-5 w-9 items-center rounded-full bg-primary" role="switch"><span class="translate-x-[-16px] inline-block h-4 w-4 transform rounded-full bg-white transition"></span></button></label><div class="relative mt-2"><input class="w-full bg-white border border-border-default rounded px-3 py-2 text-text-primary font-body text-body text-right focus:border-focus-ring focus:ring-1 focus:ring-focus-ring outline-none" dir="ltr" type="time" value="10:00"/><span class="material-symbols-outlined absolute right-3 top-2.5 text-text-secondary pointer-events-none">schedule</span></div></div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div class="space-y-1"><label class="font-label text-label text-text-primary" for="relatedCase">القضية المرتبطة</label><div class="relative"><input class="w-full bg-white border border-border-default rounded px-3 py-2 pr-10 text-text-primary font-body text-body focus:border-focus-ring focus:ring-1 focus:ring-focus-ring outline-none" id="relatedCase" type="text" value="قضية مدني كلي رقم 452 لسنة 2023 - محكمة شمال القاهرة"/><span class="material-symbols-outlined absolute right-3 top-2.5 text-text-secondary pointer-events-none">search</span><span class="material-symbols-outlined absolute left-3 top-2.5 text-text-secondary cursor-pointer hover:text-primary">arrow_drop_down</span></div></div><div class="space-y-1"><label class="font-label text-label text-text-primary" for="relatedClient">الموكل المرتبط</label><div class="relative"><input class="w-full bg-white border border-border-default rounded px-3 py-2 pr-10 text-text-primary font-body text-body focus:border-focus-ring focus:ring-1 focus:ring-focus-ring outline-none" id="relatedClient" type="text" value="أحمد محمد عبد الله"/><span class="material-symbols-outlined absolute right-3 top-2.5 text-text-secondary pointer-events-none">search</span><span class="material-symbols-outlined absolute left-3 top-2.5 text-text-secondary cursor-pointer hover:text-primary">arrow_drop_down</span></div></div></div><div class="space-y-1"><label class="font-label text-label text-text-secondary" for="notes">ملاحظات إضافية</label><textarea class="w-full bg-white border border-border-default rounded px-3 py-2 text-text-primary font-body text-body focus:border-focus-ring focus:ring-1 focus:ring-focus-ring outline-none resize-none placeholder:text-text-disabled" id="notes" placeholder="أضف أي ملاحظات أخرى..." rows="2">تجهيز حافظة المستندات المطلوبة في الجلسة السابقة وإيداعها في سكرتارية المحكمة قبل يوم الخميس.</textarea></div></div></div>
<!-- Footer Actions -->
<div class="px-gutter py-4 border-t border-border-default bg-surface-bright flex items-center justify-between sticky bottom-0 z-10"><div class="w-full flex flex-row-reverse justify-start gap-3"><button class="bg-primary text-on-primary font-label text-label px-6 py-2.5 rounded hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-sm">حفظ التغييرات</button><button class="bg-surface text-text-primary border border-border-default font-label text-label px-6 py-2.5 rounded hover:bg-surface-variant transition-colors">إلغاء</button></div></div>
