<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>إضافة مهمة جديدة - ليجال مصر</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-surface": "#2e3130",
                        "tertiary-fixed-dim": "#f9b89d",
                        "surface-bright": "#f8faf8",
                        "background": "#f8faf8",
                        "surface-variant": "#e1e3e1",
                        "tertiary": "#3f1a09",
                        "secondary": "#57605e",
                        "surface": "#f8faf8",
                        "outline-variant": "#bfc8c6",
                        "surface-tint": "#316760",
                        "error": "#C62828",
                        "tertiary-container": "#592f1c",
                        "border-default": "#D6DAD7",
                        "on-tertiary-fixed": "#331103",
                        "surface-container-highest": "#e1e3e1",
                        "on-tertiary": "#ffffff",
                        "text-secondary": "#5B6966",
                        "surface-container-high": "#e7e8e7",
                        "canvas": "#F8F5ED",
                        "on-secondary-container": "#5b6562",
                        "on-tertiary-container": "#d2967d",
                        "primary-fixed-dim": "#9ad1c8",
                        "information": "#1565C0",
                        "primary-fixed": "#b5ede4",
                        "on-surface": "#191c1b",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "surface-container-low": "#f3f4f2",
                        "text-disabled": "#8D9794",
                        "overdue": "#A61B1B",
                        "border-strong": "#B7C0BD",
                        "surface-subtle": "#F7F8F6",
                        "on-primary-fixed": "#00201d",
                        "outline": "#707977",
                        "on-primary-fixed-variant": "#154f49",
                        "secondary-fixed-dim": "#bfc9c6",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#edeeec",
                        "completed": "#336B3D",
                        "surface-selected": "#D5E9E4",
                        "on-secondary-fixed-variant": "#3f4947",
                        "primary": "#002a26",
                        "on-surface-variant": "#404947",
                        "inverse-primary": "#9ad1c8",
                        "tertiary-fixed": "#ffdbcd",
                        "on-error-container": "#93000a",
                        "text-primary": "#101E1D",
                        "on-primary-container": "#78aea6",
                        "on-background": "#191c1b",
                        "inverse-on-surface": "#f0f1ef",
                        "on-secondary-fixed": "#141d1c",
                        "secondary-container": "#d8e2df",
                        "primary-container": "#00423c",
                        "on-tertiary-fixed-variant": "#683b27",
                        "success": "#2E7D32",
                        "focus-ring": "#006D63",
                        "secondary-fixed": "#dbe5e2",
                        "surface-dim": "#d9dad9",
                        "on-error": "#ffffff",
                        "warning": "#B85C00",
                        "error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "unit": "4px",
                        "margin": "24px",
                        "gutter": "16px",
                        "sidebar-width": "260px",
                        "top-bar-height": "72px"
                    },
                    "fontFamily": {
                        "display": ["IBM Plex Sans Arabic"],
                        "title": ["IBM Plex Sans Arabic"],
                        "headline": ["IBM Plex Sans Arabic"],
                        "label": ["IBM Plex Sans Arabic"],
                        "caption": ["IBM Plex Sans Arabic"],
                        "body": ["IBM Plex Sans Arabic"]
                    },
                    "fontSize": {
                        "display": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "title": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "headline": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "label": ["14px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "caption": ["12px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "body": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'IBM Plex Sans Arabic', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .filled-icon {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-canvas text-on-surface h-screen w-screen overflow-hidden flex font-body text-body">
<!-- Background Mock: Tasks List Page (Blurred) -->
<div class="fixed inset-0 flex rtl opacity-30 filter blur-sm pointer-events-none">
<!-- Side Nav Skeleton -->
<aside class="docked fixed right-0 top-0 h-full w-[260px] bg-surface-container-low border-l border-outline-variant flex flex-col h-full rtl">
<div class="p-6">
<h1 class="font-title-lg text-title-lg font-bold text-primary">ليجال مصر</h1>
<p class="font-caption text-caption text-text-secondary">نظام إدارة المحاماة</p>
</div>
<nav class="flex-1 px-2 space-y-1 mt-4">
<div class="flex flex-row-reverse items-center justify-start gap-3 text-on-surface-variant px-4 py-3 rounded-lg"><span class="material-symbols-outlined">today</span><span class="font-label text-label">اليوم</span></div>
<div class="flex flex-row-reverse items-center justify-start gap-3 bg-primary-container text-on-primary-container border-r-4 border-primary px-4 py-3 rounded-lg"><span class="material-symbols-outlined filled-icon">task_alt</span><span class="font-label text-label">المهام</span></div>
</nav>
</aside>
<!-- Main Content Skeleton -->
<div class="flex-1 mr-[260px] flex flex-col">
<header class="docked fixed top-0 left-0 right-[260px] h-[72px] bg-surface border-b border-outline-variant flex flex-row-reverse items-center justify-between px-lg rtl z-10 px-6">
<div class="font-title text-title text-primary">المهام</div>
</header>
<main class="mt-[72px] p-6">
<div class="w-full h-12 bg-surface border border-border-default rounded mb-4"></div>
<div class="w-full h-64 bg-surface border border-border-default rounded"></div>
</main>
</div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-inverse-surface/40 backdrop-blur-sm p-4">
<!-- Dialog Container -->
<div class="bg-surface w-full max-w-2xl rounded-xl shadow-lg border border-border-default flex flex-col overflow-hidden max-h-[921px]">
<!-- Dialog Header -->
<div class="px-6 py-4 border-b border-border-default flex items-center justify-between bg-surface-subtle">
<h2 class="font-title text-title text-primary">إضافة مهمة جديدة</h2>
<button aria-label="إغلاق" class="text-on-surface-variant hover:text-error transition-colors p-1 rounded hover:bg-surface-variant">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Dialog Body -->
<div class="p-6 overflow-y-auto space-y-6">
<!-- Task Name (Focused State) -->
<div class="space-y-1">
<label class="font-label text-label text-text-primary" for="taskName">اسم المهمة <span class="text-error">*</span></label>
<input autofocus="" class="w-full bg-white border-2 border-focus-ring rounded px-3 py-2 text-text-primary font-body text-body outline-none focus:ring-0 shadow-sm" id="taskName" required="" type="text" value="مراجعة مستندات قضية النزاع العقاري"/>
</div>
<!-- Task Details -->
<div class="space-y-1">
<label class="font-label text-label text-text-secondary" for="taskDetails">تفاصيل المهمة (اختياري)</label>
<textarea class="w-full bg-white border border-border-default rounded px-3 py-2 text-text-primary font-body text-body focus:border-focus-ring focus:ring-1 focus:ring-focus-ring outline-none resize-none placeholder:text-text-disabled" id="taskDetails" placeholder="أدخل تفاصيل المهمة هنا..." rows="3"></textarea>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Execution Date -->
<div class="space-y-1">
<label class="font-label text-label text-text-primary" for="executionDate">تاريخ التنفيذ</label>
<div class="relative">
<input class="w-full bg-white border border-border-default rounded px-3 py-2 pr-10 text-text-primary font-body text-body text-right focus:border-focus-ring focus:ring-1 focus:ring-focus-ring outline-none" dir="ltr" id="executionDate" type="text" value="20/10/2024"/>
<span class="material-symbols-outlined absolute right-3 top-2.5 text-text-secondary pointer-events-none">calendar_today</span>
</div>
</div>
<!-- Reminder Toggle & Time -->
<div class="space-y-1">
<label class="font-label text-label text-text-primary flex items-center justify-between">
<span>تذكير</span>
<button aria-checked="true" class="relative inline-flex h-5 w-9 items-center rounded-full bg-primary" role="switch">
<span class="translate-x-[-16px] inline-block h-4 w-4 transform rounded-full bg-white transition"></span>
</button>
</label>
<div class="relative mt-2">
<input class="w-full bg-white border border-border-default rounded px-3 py-2 text-text-primary font-body text-body text-right focus:border-focus-ring focus:ring-1 focus:ring-focus-ring outline-none" dir="ltr" type="time" value="09:00"/>
<span class="material-symbols-outlined absolute right-3 top-2.5 text-text-secondary pointer-events-none">schedule</span>
</div>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Related Case Combobox -->
<div class="space-y-1">
<label class="font-label text-label text-text-primary" for="relatedCase">القضية المرتبطة</label>
<div class="relative">
<input class="w-full bg-white border border-border-default rounded px-3 py-2 pr-10 text-text-primary font-body text-body focus:border-focus-ring focus:ring-1 focus:ring-focus-ring outline-none" id="relatedCase" type="text" value="نزاع عقاري - 452/2024"/>
<span class="material-symbols-outlined absolute right-3 top-2.5 text-text-secondary pointer-events-none">search</span>
<span class="material-symbols-outlined absolute left-3 top-2.5 text-text-secondary cursor-pointer hover:text-primary">arrow_drop_down</span>
</div>
</div>
<!-- Related Client Combobox -->
<div class="space-y-1">
<label class="font-label text-label text-text-primary" for="relatedClient">الموكل المرتبط</label>
<div class="relative">
<input class="w-full bg-white border border-border-default rounded px-3 py-2 pr-10 text-text-primary font-body text-body focus:border-focus-ring focus:ring-1 focus:ring-focus-ring outline-none" id="relatedClient" type="text" value="شركة الأفق للتطوير"/>
<span class="material-symbols-outlined absolute right-3 top-2.5 text-text-secondary pointer-events-none">search</span>
<span class="material-symbols-outlined absolute left-3 top-2.5 text-text-secondary cursor-pointer hover:text-primary">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Notes -->
<div class="space-y-1">
<label class="font-label text-label text-text-secondary" for="notes">ملاحظات إضافية</label>
<textarea class="w-full bg-white border border-border-default rounded px-3 py-2 text-text-primary font-body text-body focus:border-focus-ring focus:ring-1 focus:ring-focus-ring outline-none resize-none placeholder:text-text-disabled" id="notes" placeholder="أضف أي ملاحظات أخرى..." rows="2"></textarea>
</div>
</div>
<!-- Dialog Footer -->
<div class="px-6 py-4 border-t border-border-default bg-surface-subtle flex flex-row-reverse justify-start gap-3">
<button class="bg-primary text-on-primary font-label text-label px-6 py-2.5 rounded hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-sm">
                    إضافة مهمة
                </button>
<button class="bg-surface text-text-primary border border-border-default font-label text-label px-6 py-2.5 rounded hover:bg-surface-variant transition-colors">
                    إلغاء
                </button>
</div>
</div>
</div>
</body></html>
