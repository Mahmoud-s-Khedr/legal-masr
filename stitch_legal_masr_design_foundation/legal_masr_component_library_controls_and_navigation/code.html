<!DOCTYPE html><html dir="rtl" lang="ar"><head>

<style>
        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            background-color: #F8F5ED; /* Canvas color mapped to base */
            color: #101E1D; /* text-primary */
        }
        
        .component-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .focus-visible-ring:focus-visible {
            outline: 2px solid #006D63; /* focus-ring */
            outline-offset: 2px;
        }

        /* Material Icon Alignment */
        .material-symbols-outlined {
            vertical-align: middle;
            font-size: 20px;
        }
        
        .demo-box {
            background: white;
            border: 1px solid #D6DAD7;
            border-radius: 4px;
            padding: 24px;
        }
    </style>
</head>
<body class="p-8">
<header class="mb-12 border-b border-border-default pb-6">
<h1 class="font-display text-display text-primary mb-2">مكتبة المكونات - ليجال مصر</h1>
<p class="font-body text-body text-text-secondary">عناصر التحكم والتنقل (Controls and Navigation)</p>
</header>
<main class="max-w-7xl mx-auto space-y-16">
<!-- 1. BUTTONS SECTION -->
<section>
<h2 class="font-headline text-headline text-primary mb-6 border-l-4 border-primary pl-4">1. الأزرار (Buttons)</h2>
<div class="component-grid">
<!-- Primary & Secondary -->
<div class="demo-box flex flex-col gap-4">
<h3 class="font-title text-title text-text-secondary border-b border-border-default pb-2">الأساسية والثانوية</h3>
<div class="flex gap-4 flex-wrap items-center">
<button class="bg-primary text-on-primary font-label text-label px-4 py-2 rounded focus-visible-ring hover:opacity-90 transition-opacity flex items-center justify-center">
                            زر أساسي
                        </button>
<button class="bg-surface text-primary border border-border-default font-label text-label px-4 py-2 rounded focus-visible-ring hover:bg-surface-subtle transition-colors flex items-center justify-center">
                            زر ثانوي
                        </button>
</div>
</div>
<!-- Ghost & Destructive -->
<div class="demo-box flex flex-col gap-4">
<h3 class="font-title text-title text-text-secondary border-b border-border-default pb-2">شبحية وتدميرية</h3>
<div class="flex gap-4 flex-wrap items-center">
<button class="text-primary font-label text-label px-4 py-2 rounded focus-visible-ring hover:bg-surface-subtle transition-colors flex items-center justify-center">
                            زر شبحي
                        </button>
<button class="bg-error text-on-error font-label text-label px-4 py-2 rounded focus-visible-ring hover:opacity-90 transition-opacity flex items-center justify-center">
                            حذف السجل
                        </button>
</div>
</div>
<!-- Icons & Loading -->
<div class="demo-box flex flex-col gap-4">
<h3 class="font-title text-title text-text-secondary border-b border-border-default pb-2">أيقونات وحالة التحميل</h3>
<div class="flex gap-4 flex-wrap items-center">
<button class="bg-primary text-on-primary font-label text-label px-4 py-2 rounded focus-visible-ring hover:opacity-90 transition-opacity flex items-center justify-center gap-2">
<span class="material-symbols-outlined">add</span>
                            إضافة موكل
                        </button>
<button aria-label="تعديل" class="bg-surface text-primary border border-border-default p-2 rounded focus-visible-ring hover:bg-surface-subtle transition-colors flex items-center justify-center">
<span class="material-symbols-outlined">edit</span>
</button>
<button class="bg-primary text-on-primary font-label text-label px-4 py-2 rounded opacity-70 cursor-not-allowed flex items-center justify-center gap-2" disabled="">
<span class="material-symbols-outlined animate-spin">refresh</span>
                            جاري الحفظ...
                        </button>
</div>
</div>
</div>
</section>
<!-- 2. FORM CONTROLS SECTION -->
<section>
<h2 class="font-headline text-headline text-primary mb-6 border-l-4 border-primary pl-4">2. عناصر النماذج (Form Controls)</h2>
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
<!-- Text Input -->
<div class="demo-box">
<label class="block font-label text-label text-text-primary mb-1">الاسم الكامل</label>
<input class="w-full bg-surface text-text-primary border border-border-default rounded px-3 py-2 focus:ring-2 focus:ring-focus-ring focus:border-focus-ring transition-shadow" placeholder="أدخل اسم الموكل" type="text">
</div>
<!-- Search Input -->
<div class="demo-box">
<label class="block font-label text-label text-text-primary mb-1">بحث</label>
<div class="relative">
<span class="material-symbols-outlined absolute right-3 top-2.5 text-text-secondary">search</span>
<input class="w-full bg-surface text-text-primary border border-border-default rounded pr-10 pl-3 py-2 focus:ring-2 focus:ring-focus-ring focus:border-focus-ring transition-shadow" placeholder="بحث برقم القضية..." type="search">
</div>
</div>
<!-- Numeric Input (LTR Isolated) -->
<div class="demo-box">
<label class="block font-label text-label text-text-primary mb-1">الرقم القومي</label>
<input class="w-full bg-surface text-text-primary border border-border-default rounded px-3 py-2 focus:ring-2 focus:ring-focus-ring focus:border-focus-ring transition-shadow text-right" dir="ltr" placeholder="14 رقم" type="text">
</div>
<!-- Checkbox & Radio -->
<div class="demo-box flex flex-col gap-4">
<div class="flex items-center gap-2">
<input class="w-4 h-4 text-primary border-border-default rounded focus:ring-focus-ring" id="check1" type="checkbox">
<label class="font-label text-label text-text-primary" for="check1">مرفق مستندات</label>
</div>
<div class="flex items-center gap-4">
<div class="flex items-center gap-2">
<input checked="" class="w-4 h-4 text-primary border-border-default focus:ring-focus-ring" id="radio1" name="status" type="radio">
<label class="font-label text-label text-text-primary" for="radio1">نشط</label>
</div>
<div class="flex items-center gap-2">
<input class="w-4 h-4 text-primary border-border-default focus:ring-focus-ring" id="radio2" name="status" type="radio">
<label class="font-label text-label text-text-primary" for="radio2">مؤرشف</label>
</div>
</div>
</div>
<!-- Toggle -->
<div class="demo-box flex items-center justify-between">
<label class="font-label text-label text-text-primary">تفعيل التنبيهات</label>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value="">
<div class="w-11 h-6 bg-surface-dim rounded-full peer peer-focus:ring-2 peer-focus:ring-focus-ring peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:right-[2px] after:bg-white after:border-border-default after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</div>
</section>
</main>
</body></html>
